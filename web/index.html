<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href placeholder below is replaced by the value of the
    `--base-href` argument given to `flutter build web`. For GitHub Pages the
    build uses --base-href "/SafeCircle/" (see .github/workflows/deploy.yml).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SafeCircle - a personal safety app with one-tap SOS, live location sharing, trusted contacts and safety check-ins.">
  <meta name="theme-color" content="#172C48">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SafeCircle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SafeCircle - Personal Safety</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #172C48; }
    /* Simple splash shown while the Flutter engine downloads and starts. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(160deg, #0E1D33, #172C48 60%, #284C7A);
      color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      transition: opacity .4s ease;
    }
    #splash img { width: 84px; height: 84px; border-radius: 20px; }
    #splash h1 { margin: 0; font-size: 28px; letter-spacing: -.5px; }
    #splash p { margin: 0; color: rgba(255,255,255,.7); font-size: 14px; }
    .spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25); border-top-color: #E45459;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="SafeCircle logo">
    <h1>SafeCircle</h1>
    <p>Stay connected. Stay protected.</p>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove the splash as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
